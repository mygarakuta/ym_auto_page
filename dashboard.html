<div class="wrap" data-role="card">
  <div class="row">
    <span class="badge" data-role="badge">불러오는 중</span>
    <span class="hint" data-role="hint">뷰어를 연 뒤 단축키로 시작/정지합니다.</span>
    <button type="button" class="fold" data-role="fold" aria-label="접기" title="접기" hidden>▾</button>
  </div>
  <div class="ctl">
    <button type="button" data-role="minus" aria-label="간격 줄이기">−</button>
    <span class="sec" data-role="sec">-</span>
    <button type="button" data-role="plus" aria-label="간격 늘리기">+</button>
  </div>
</div>
